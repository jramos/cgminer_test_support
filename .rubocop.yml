AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'pkg/**/*'

plugins:
  - rubocop-rake
  - rubocop-rspec

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

# Integration-style specs that drive the TCP server end-to-end need
# room to set up a socket, send bytes, read bytes, and assert. Splitting
# those into 5-line examples obscures the contract being tested.
RSpec/ExampleLength:
  Exclude:
    - 'spec/**/*'

# Integration specs describe a behavior or executable, not a class.
RSpec/DescribeClass:
  Exclude:
    - 'spec/integration/**/*'
